<!DOCTYPE html>
<html lang="pl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FN Tracker</title>


<style>

*{
box-sizing:border-box;
}


body{

margin:0;
font-family:Arial,sans-serif;
background:#0f1219;
color:white;
padding-bottom:80px;

}



header{

text-align:center;
background:#171c27;
padding:20px;

}



.logo{

font-size:35px;
font-weight:bold;
color:#00aaff;

}



.page{

display:none;
padding:20px;

}



.page.active{

display:block;

}



.card{

background:#1c2330;
padding:20px;
border-radius:15px;
margin-bottom:15px;

}



.shop-grid{

display:grid;
grid-template-columns:repeat(2,1fr);
gap:15px;

}



.item{

background:#252e3d;
padding:10px;
border-radius:15px;
text-align:center;

}



.item img{

width:100%;
border-radius:12px;

}



.price{

color:#00aaff;
font-weight:bold;

}



.category{

color:#aaa;

}



input,select{

width:100%;
padding:12px;
margin:7px 0;
border-radius:10px;
border:0;
background:#10131a;
color:white;

}



.add{

width:100%;
padding:12px;
background:#00aaff;
color:white;
border:0;
border-radius:10px;
font-weight:bold;

}



.bottom-menu{

position:fixed;
bottom:0;
left:0;
width:100%;
background:#171c27;
display:flex;
justify-content:space-around;
padding:10px;

}



.bottom-menu button{

background:none;
border:0;
color:white;

}



.map-box{

height:500px;
position:relative;
overflow:hidden;
border-radius:15px;
background:#111;

}



.map-box img{

width:100%;
height:100%;
object-fit:cover;

}



.marker{

position:absolute;
font-size:28px;
cursor:pointer;
transform:translate(-50%,-50%);

}



.empty{

text-align:center;
color:#888;

}



</style>


</head>


<body>


<header>

<div class="logo">
FN Tracker
</div>

<p>Fortnite Companion</p>

</header>




<div id="shop" class="page active">


<div class="card">

<h2>🛒 Sklep Fortnite</h2>

<h3 id="shopDate">
Dzisiejsza rotacja
</h3>


</div>



<div class="shop-grid" id="shopItems">


<div class="empty">

Ładowanie...

</div>


</div>


</div>






<div id="map" class="page">


<div class="card">


<h2>🗺️ Mapa Fortnite</h2>


<img src="https://i.imgur.com/8QZQZQG.jpeg">



<div class="marker"
style="left:30%;top:40%;"
onclick="showMarker('📦 Skrzynka')">

📦

</div>



<div class="marker"
style="left:60%;top:55%;"
onclick="showMarker('🔄 Reboot Van')">

🔄

</div>



<div class="marker"
style="left:45%;top:70%;"
onclick="showMarker('🚗 Pojazd')">

🚗

</div>



<div class="marker"
style="left:75%;top:30%;"
onclick="showMarker('🎣 Wędka')">

🎣

</div>



<div class="marker"
style="left:50%;top:50%;"
onclick="showMarker('📍 Miejscówka')">

📍

</div>



</div>



<div class="card" id="markerInfo">

Kliknij marker

</div>


</div>


</div><div id="settings" class="page">


<div class="card">


<h2>⚙️ Ustawienia</h2>


<p>
FN Tracker - Fortnite Companion
</p>


<p>
Wersja: 1.2
</p>


</div>


</div>





<div id="admin" class="page">


<div class="card">


<h2>👑 Panel Admina</h2>


<input id="name" placeholder="Nazwa przedmiotu">



<input id="price" placeholder="Cena V-dolców">



<input id="rarity" placeholder="Rzadkość">



<select id="category">


<option value="Strój">
👕 Strój
</option>


<option value="Kilof">
⛏️ Kilof
</option>


<option value="Emotka">
💃 Emotka
</option>


<option value="Plecak">
🎒 Plecak
</option>


<option value="Lotnia">
🪂 Lotnia
</option>


</select>




<input id="image" placeholder="Link do obrazka">



<input id="date" placeholder="Data sklepu np. 07.08.2026">



<button class="add" onclick="addItem()">

➕ Dodaj przedmiot

</button>



</div>



<div class="card">


<h2>📍 Markery</h2>


<p>
Tutaj później dodamy dodawanie własnych markerów.
</p>


</div>



</div>






<div class="bottom-menu">


<button onclick="openPage('shop')">

🛒<br>
Sklep

</button>



<button onclick="openPage('map')">

🗺️<br>
Mapa

</button>



<button onclick="openPage('settings')">

⚙️<br>
Ustawienia

</button>



<button id="adminButton" style="display:none" onclick="openPage('admin')">

👑<br>
Admin

</button>



</div><
        
</body>
  
</html>
<script type="module">


import { initializeApp } 
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {

getFirestore,

collection,

addDoc,

getDocs

}

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";




const firebaseConfig = {


apiKey: "AIzaSyBlQzF_lY7plf0iz0Aeo3kfj2083OH3CeI",

authDomain: "fn-tracker-7ca77.firebaseapp.com",

projectId: "fn-tracker-7ca77",

storageBucket: "fn-tracker-7ca77.firebasestorage.app",

messagingSenderId: "894926360582",

appId: "1:894926360582:web:446c19751ef653b3fa7387"


};




const app = initializeApp(firebaseConfig);


const db = getFirestore(app);





window.openPage = function(id){


let pages = document.querySelectorAll(".page");


pages.forEach(page=>{

page.classList.remove("active");

});


document.getElementById(id).classList.add("active");


};







window.showMarker = function(text){


document.getElementById("markerInfo").innerHTML =

"📍 " + text;


};







window.addItem = async function(){



let item = {


name: document.getElementById("name").value,


price: document.getElementById("price").value,


rarity: document.getElementById("rarity").value,


category: document.getElementById("category").value,


image: document.getElementById("image").value,


date: document.getElementById("date").value


};




if(item.name==="" || item.price===""){


alert("Wpisz nazwę i cenę!");


return;


}




await addDoc(

collection(db,"shop"),

item

);



alert("✅ Dodano do sklepu!");



loadShop();


};







async function loadShop(){


let shop = document.getElementById("shopItems");


shop.innerHTML="";



let items = await getDocs(

collection(db,"shop")

);




let today = new Date().toLocaleDateString("pl-PL");



let found=false;



items.forEach(doc=>{


let data = doc.data();




if(data.date===today || data.date===""){


found=true;



shop.innerHTML += `


<div class="item">


<img src="${data.image || 'https://via.placeholder.com/300'}">



<h3>

${data.name}

</h3>



<p class="category">

${data.category}

</p>



<p>

${data.rarity}

</p>



<div class="price">

${data.price} V-dolców

</div>


</div>


`;



}



});




document.getElementById("shopDate").innerHTML =

"🗓️ Sklep: " + today;



if(!found){


shop.innerHTML =

'<div class="empty">Brak przedmiotów na dziś</div>';


}



}







const password = prompt("🔐 Hasło administratora:");



if(password==="FNTRACKER2026"){


document.getElementById("adminButton").style.display="block";


}







loadShop();



</script>


</body>

</html>
