.category {

.bottom-menu {

left:0;
width:100%;
background:#171c27;
display:flex;
justify-content:space-around;
padding:10px;

}



.bottom-menu button {

background:none;
border:0;
color:white;

}



.empty {

text-align:center;
color:#888;

}




.map-box {

width:100%;
height:500px;
overflow:hidden;
border-radius:15px;
background:#111;
position:relative;

}



.map-box img {

width:100%;
height:auto;

}



.marker {

position:absolute;
font-size:28px;
cursor:pointer;
transform:translate(-50%,-50%);

}


.marker:hover {

scale:1.2;

}



.map-buttons {

display:flex;
gap:10px;
margin-top:15px;

}



.map-buttons button {

flex:1;
padding:10px;
border:0;
border-radius:10px;
background:#00aaff;
color:white;

}



</style>
