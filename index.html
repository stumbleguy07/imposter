<!DOCTYPE html>
<html lang="pl">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FN Tracker</title>

<style>

body {
    margin:0;
    font-family:Arial,sans-serif;
    background:#0b0e14;
    color:white;
}

header {
    text-align:center;
    background:#151a25;
    padding:20px;
}

.logo {
    font-size:35px;
    font-weight:bold;
    color:#00aaff;
}


.page {
    display:none;
    padding:20px;
    padding-bottom:90px;
}


.active {
    display:block;
}


.card {
    background:#1c2330;
    border-radius:20px;
    padding:20px;
    margin-bottom:20px;
}



.shop-grid {
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
}


.item {
    background:#252e3d;
    border-radius:15px;
    padding:10px;
    text-align:center;
}


.item img {
    width:100%;
    border-radius:12px;
}


.price {
    color:#00aaff;
    font-weight:bold;
}



input {
    width:90%;
    padding:12px;
    margin:8px;
    border-radius:10px;
    border:none;
    background:#10131a;
    color:white;
}


.add {
    background:#00aaff;
    color:white;
    padding:12px;
    border:none;
    border-radius:10px;
    font-weight:bold;
}



.bottom-menu {

position:fixed;
bottom:0;
left:0;
width:100%;
background:#151a25;
display:flex;
justify-content:space-around;
padding:12px 0;

}


.bottom-menu button {

background:none;
border:none;
color:white;
font-size:14px;

}


</style>

</head>


<body>


<header>

<div class="logo">
FN Tracker
</div>

<p>Fortnite Companion</p>

</header>



<!-- SKLEP -->

<div id="shop" class="page active">

<h2>🛒 Sklep Fortnite</h2>

<div class="shop-grid">


<div class="item">

<img src="https://via.placeholder.com/300">

<h3>Skin przykładowy</h3>

<p>Legendarny</p>

<div class="price">
1500 V-dolców
</div>

</div>


</div>

</div>




<!-- MAPA -->

<div id="map" class="page">

<div class="card">

<h2>🗺️ Mapa Fortnite</h2>

<p>
Tutaj dodamy:
<br><br>
✅ skrzynki
<br>
✅ reboot vany
<br>
✅ auta
<br>
✅ wędki
<br>
✅ miejscówki
<br>
✅ przybliżanie mapy
</p>

</div>

</div>




<!-- USTAWIENIA -->


<div id="settings" class="page">

<div class="card">

<h2>⚙️ Ustawienia</h2>

<p>
Tryb aplikacji i ustawienia FN Tracker.
</p>

</div>

</div>




<!-- ADMIN -->


<div id="admin" class="page">

<h2>👑 Panel Admina</h2>


<div class="card">


<input id="name" placeholder="Nazwa przedmiotu">


<input id="price" placeholder="Cena">


<input id="rarity" placeholder="Rzadkość">



<button class="add" onclick="addItem()">

Dodaj do sklepu

</button>


</div>


</div>





<div class="bottom-menu">


<button onclick="openPage('shop')">
🛒<br>
Sklep
</button>


<button onclick="openPage('map')">
🗺️<br>
Mapa
</button>


<button onclick="openPage('settings')">
⚙️<br>
Ustawienia
</button>


<button onclick="openPage('admin')">
👑<br>
Admin
</button>


</div>





<script>


function openPage(id){


let pages=document.querySelectorAll(".page");


pages.forEach(page=>{

page.classList.remove("active");

});


document.getElementById(id).classList.add("active");


}




function addItem(){


let name=document.getElementById("name").value;

let price=document.getElementById("price").value;

let rarity=document.getElementById("rarity").value;



if(name==="" || price===""){

alert("Wpisz nazwę i cenę!");

return;

}



let shop=document.querySelector(".shop-grid");



shop.innerHTML += `

<div class="item">

<img src="https://via.placeholder.com/300">

<h3>${name}</h3>

<p>${rarity}</p>

<div class="price">

${price} V-dolców

</div>

</div>

`;



alert("Dodano!");

}


</script>


</body>
</html>
