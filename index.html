<!DOCTYPE html>
<html lang="pl">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FN Tracker</title>

<style>

body {
    margin:0;
    font-family:Arial,sans-serif;
    background:#0f1219;
    color:white;
}

header {
    text-align:center;
    background:#171c27;
    padding:20px;
}

.logo {
    font-size:35px;
    font-weight:bold;
    color:#00aaff;
}

.page {
    display:none;
    padding:20px;
    padding-bottom:90px;
}

.page.active {
    display:block;
}

.card {
    background:#1c2330;
    padding:20px;
    border-radius:15px;
    margin-bottom:15px;
}

.shop-grid {
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
}

.item {
    background:#252e3d;
    border-radius:15px;
    padding:10px;
    text-align:center;
}

.item img {
    width:100%;
    border-radius:10px;
}

.price {
    color:#00aaff;
    font-weight:bold;
}

input {
    width:90%;
    padding:12px;
    margin:8px;
    border-radius:10px;
    border:none;
    background:#10131a;
    color:white;
}

.add {
    background:#00aaff;
    color:white;
    border:0;
    padding:12px;
    border-radius:10px;
    font-weight:bold;
}

.bottom-menu {
    position:fixed;
    bottom:0;
    left:0;
    width:100%;
    background:#171c27;
    display:flex;
    justify-content:space-around;
    padding:12px 0;
}

.bottom-menu button {
    background:none;
    border:0;
    color:white;
}

</style>


<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import { 
getFirestore,
collection,
addDoc,
getDocs
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


const firebaseConfig = {

apiKey: "AIzaSyBlQzF_lY7plf0iz0Aeo3kfj2083OH3CeI",

authDomain: "fn-tracker-7ca77.firebaseapp.com",

projectId: "fn-tracker-7ca77",

storageBucket: "fn-tracker-7ca77.firebasestorage.app",

messagingSenderId: "894926360582",

appId: "1:894926360582:web:446c19751ef653b3fa7387"

};


const app = initializeApp(firebaseConfig);

const db = getFirestore(app);


window.db = db;
window.collection = collection;
window.addDoc = addDoc;
window.getDocs = getDocs;


</script>

</head>


<body>


<header>

<div class="logo">
FN Tracker
</div>

<p>Fortnite Companion</p>

</header><div id="shop" class="page active">

<h2>🛒 Sklep Fortnite</h2>

<div class="shop-grid" id="shopItems">

</div>

</div>




<div id="map" class="page">

<div class="card">

<h2>🗺️ Mapa Fortnite</h2>

<p>
Tutaj dodamy:
<br><br>
✅ skrzynki
<br>
✅ reboot vany
<br>
✅ auta
<br>
✅ wędki
<br>
✅ miejscówki
<br>
✅ zoom mapy
</p>

</div>

</div>




<div id="settings" class="page">

<div class="card">

<h2>⚙️ Ustawienia</h2>

<p>
Ustawienia FN Tracker.
</p>

</div>

</div>




<div id="admin" class="page">

<h2>👑 Panel Admina</h2>

<div class="card">

<input id="name" placeholder="Nazwa przedmiotu">

<input id="price" placeholder="Cena V-dolców">

<input id="rarity" placeholder="Rzadkość">


<button class="add" onclick="addItem()">
Dodaj przedmiot
</button>

</div>

</div>





<div class="bottom-menu">

<button onclick="openPage('shop')">
🛒<br>Sklep
</button>


<button onclick="openPage('map')">
🗺️<br>Mapa
</button>


<button onclick="openPage('settings')">
⚙️<br>Ustawienia

<button id="adminButton" 
style="display:none;"
<button onclick="openPage('admin')">
👑<br>Admin
</button>

</div>




<script>


function openPage(id){

let pages=document.querySelectorAll(".page");

pages.forEach(function(page){

page.classList.remove("active");

});


document.getElementById(id).classList.add("active");

}




async function addItem(){

let name=document.getElementById("name").value;

let price=document.getElementById("price").value;

let rarity=document.getElementById("rarity").value;



if(name==="" || price===""){

alert("Wpisz nazwę i cenę");

return;

}



await addDoc(collection(db,"shop"),{

name:name,

price:price,

rarity:rarity

});



alert("Dodano do sklepu!");



loadShop();

}




async function loadShop(){


let shop=document.getElementById("shopItems");


shop.innerHTML="";


let items=await getDocs(collection(db,"shop"));



items.forEach(function(doc){


let data=doc.data();



shop.innerHTML += `

<div class="item">

<img src="https://via.placeholder.com/300">

<h3>${data.name}</h3>

<p>${data.rarity}</p>

<div class="price">

${data.price} V-dolców

</div>

</div>

`;


});


}



loadShop();


</script>



</body>
</html>
