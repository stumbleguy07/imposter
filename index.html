<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FN Tracker</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #10131a;
    color: white;
}

header {
    text-align: center;
    padding: 20px;
    background: #181d28;
}

.logo {
    font-size: 35px;
    font-weight: bold;
    color: #00aaff;
}

.page {
    display: none;
    padding: 20px;
}

.active {
    display: block;
}

.card {
    background: #1c2330;
    border-radius: 15px;
    padding: 20px;
    margin-bottom: 15px;
}

.bottom-menu {
    position: fixed;
    bottom: 0;
    width: 100%;
    background: #181d28;
    display: flex;
    justify-content: space-around;
    padding: 12px 0;
}

.bottom-menu button {
    background: none;
    border: none;
    color: white;
    font-size: 14px;
}

</style>
</head>

<body>

<header>
<div class="logo">FN Tracker</div>
<p>Fortnite Companion</p>
</header>


<div id="shop" class="page active">
<div class="card">
<h2>🛒 Sklep Fortnite</h2>
<p>Tu będzie codzienna rotacja sklepu.</p>
</div>
</div>


<div id="map" class="page">
<div class="card">
<h2>🗺️ Mapa Fortnite</h2>
<p>Tu dodamy interaktywną mapę.</p>
</div>
</div>


<div id="settings" class="page">
<div class="card">
<h2>⚙️ Ustawienia</h2>
<p>Opcje aplikacji.</p>
</div>
</div>


<div id="admin" class="page">
<div class="card">
<h2>👑 Panel Admina</h2>
<p>Tylko dla właściciela.</p>
</div>
</div>


<div class="bottom-menu">
<button onclick="openPage('shop')">🛒<br>Sklep</button>
<button onclick="openPage('map')">🗺️<br>Mapa</button>
<button onclick="openPage('settings')">⚙️<br>Ustawienia</button>
<button onclick="openPage('admin')">👑<br>Admin</button>
</div>


<script>
function openPage(page) {

let pages = document.querySelectorAll(".page");

pages.forEach(p => {
p.classList.remove("active");
});

document.getElementById(page).classList.add("active");

function addItem(){

let name = document.getElementById("itemName").value;
let price = document.getElementById("itemPrice").value;
let rarity = document.getElementById("itemRarity").value;


if(name === "" || price === ""){
    alert("Uzupełnij dane!");
    return;
}


let shop = document.querySelector(".shop-grid");


let item = document.createElement("div");

item.className = "item-card";

item.innerHTML = `
<img src="https://via.placeholder.com/300">
<h3>${name}</h3>
<p>${rarity}</p>
<strong>${price} V-dolców</strong>
`;


shop.appendChild(item);


document.getElementById("itemName").value="";
document.getElementById("itemPrice").value="";
document.getElementById("itemRarity").value="";

alert("Dodano do sklepu!");
}
</script>


</body>
</html>
